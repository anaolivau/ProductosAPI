name: Build, Test and Deploy ProductosAPI to Azure Web App - productos-api-anacecilia

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore ./ProductosAPI/ProductosAPI.csproj

      - name: Build API
        run: dotnet build ./ProductosAPI/ProductosAPI.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish ./ProductosAPI/ProductosAPI.csproj -c Release -o ./publish --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  test:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Restore test dependencies
        run: dotnet restore ./ProductosAPI.Tests/ProductosAPI.Tests.csproj

      - name: Run unit tests with coverage
        run: dotnet test ./ProductosAPI.Tests/ProductosAPI.Tests.csproj -c Release --no-restore --collect:"XPlat Code Coverage" --results-directory ./TestResults --logger "trx;LogFileName=test_results.trx"

      - name: Generate coverage report
        run: reportgenerator -reports:./TestResults/**/coverage.cobertura.xml -targetdir:./TestResults/CoverageReport -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Publish coverage summary in pipeline
        shell: pwsh
        run: Get-Content ./TestResults/CoverageReport/SummaryGithub.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/test_results.trx

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport

      - name: Check minimum coverage (60%)
        shell: pwsh
        run: |
          $archivo = Get-ChildItem -Path ./TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          [xml]$xml = Get-Content $archivo.FullName
          $cobertura = [math]::Round([double]$xml.coverage.'line-rate' * 100, 2)
          Write-Host "Cobertura de lineas: $cobertura%"
          if ($cobertura -lt 60) {
            Write-Error "La cobertura ($cobertura%) es menor al 60% requerido."
            exit 1
          }

  deploy:
    runs-on: windows-latest
    needs: [build, test]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E1880A3B02CC42F3B8F5A2169A0E1CDD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B17132CBE62A424EA808D4DC00D84312 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00315D9BA56942ECB87D8E12542A3AEB }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'productos-api-anacecilia'
          slot-name: 'Production'
          package: ./publish
          
